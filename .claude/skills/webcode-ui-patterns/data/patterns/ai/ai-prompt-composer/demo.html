<style>
  .apc { min-height: 100vh; padding: 24px 16px; display: grid; align-content: end; gap: 12px; max-width: 720px; margin: 0 auto; color: var(--wc-fg); font-size: var(--wc-font-size-sm); }
  .apc-ex { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .apc-ex button { text-align: left; padding: 12px 14px; min-height: 44px; border-radius: var(--wc-radius-md); border: 1px solid var(--wc-border); background: var(--wc-surface); color: var(--wc-fg); font: inherit; cursor: pointer; transition: border-color var(--wc-motion-duration-fast), translate var(--wc-motion-duration-fast) var(--wc-motion-ease-out); }
  .apc-ex button:hover { border-color: var(--wc-accent); translate: 0 calc(-1px * var(--wc-motion-distance)); }
  .apc-ex[hidden] { display: none; }
  .apc-box { border: 1px solid var(--wc-border-strong); border-radius: var(--wc-radius-lg); background: var(--wc-surface); padding: 8px; display: grid; gap: 6px; transition: border-color var(--wc-motion-duration-fast); }
  .apc-box:focus-within { border-color: var(--wc-accent); box-shadow: 0 0 0 3px var(--wc-accent-soft); }
  .apc-scope { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--wc-fg-muted); font-size: var(--wc-font-size-xs); padding: 2px 4px; }
  .apc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: var(--wc-radius-pill); background: var(--wc-sunken); color: var(--wc-fg); font-size: var(--wc-font-size-xs); }
  .apc-chip button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: none; color: var(--wc-fg-muted); cursor: pointer; font: inherit; }
  .apc textarea { field-sizing: content; min-height: 44px; max-height: 12lh; resize: none; border: 0; outline: 0; background: transparent; color: var(--wc-fg); font: inherit; font-size: var(--wc-font-size-md); line-height: var(--wc-line-height-snug); padding: 8px; }
  .apc-foot { display: flex; align-items: center; gap: 8px; }
  .apc-foot small { flex: 1; color: var(--wc-fg-muted); font-size: var(--wc-font-size-xs); }
  .apc-ic { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--wc-radius-md); border: 0; background: none; color: var(--wc-fg-muted); cursor: pointer; }
  .apc-send { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--wc-accent-solid); color: var(--wc-accent-solid-fg); cursor: pointer; transition: opacity var(--wc-motion-duration-fast), scale var(--wc-motion-duration-instant); }
  .apc-send[aria-disabled] { opacity: .4; cursor: not-allowed; }
  .apc-send:active:not([aria-disabled]) { scale: .92; }
  .apc button:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
  .apc-sent { margin: 0; padding: 12px 14px; border-radius: var(--wc-radius-lg); background: var(--wc-accent-soft); justify-self: end; max-width: 80%; white-space: pre-wrap; }
  @media (max-width: 520px) { .apc-kbd { display: none; } }
  .apc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
<div class="apc">
  <div class="apc-log"></div>
  <div class="apc-ex" role="group" aria-label="Exemplos">
    <button type="button">Resuma as vendas de outubro por canal</button>
    <button type="button">Quais clientes não compram há 90 dias?</button>
    <button type="button">Escreva um e-mail de cobrança gentil</button>
  </div>
  <form class="apc-box">
    <div class="apc-scope"><span>Usando:</span><span class="apc-chip">Pedidos de outubro · 312 registros</span><span class="apc-files"></span></div>
    <label for="apc-t" class="apc-sr">Mensagem para o assistente</label>
    <textarea id="apc-t" rows="1" placeholder="Pergunte sobre seus dados…" aria-describedby="apc-h"></textarea>
    <div class="apc-foot">
      <button type="button" class="apc-ic apc-att" aria-label="Anexar arquivo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button>
      <small id="apc-h"><span class="apc-kbd">Enter envia · Shift+Enter quebra linha</span></small>
      <button type="submit" class="apc-send" aria-label="Enviar" aria-disabled="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </form>
  <p class="apc-sr" role="status" id="apc-live"></p>
</div>
<script>
(() => {
  const root = document.querySelector('.apc'), t = root.querySelector('textarea'), send = root.querySelector('.apc-send'), ex = root.querySelector('.apc-ex'), files = root.querySelector('.apc-files'), log = root.querySelector('.apc-log'), live = document.getElementById('apc-live');
  const fit = () => { if (!CSS.supports('field-sizing', 'content')) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 240) + 'px'; } };
  const sync = () => { const empty = !t.value.trim(); send.toggleAttribute('aria-disabled', empty); if (empty) send.setAttribute('aria-disabled', 'true'); ex.hidden = !!t.value || !!log.children.length; fit(); };
  t.addEventListener('input', sync);
  t.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer: fine)').matches) { e.preventDefault(); root.querySelector('form').requestSubmit(); } });
  ex.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; t.value = b.textContent; sync(); t.focus(); });
  let n = 0;
  root.querySelector('.apc-att').addEventListener('click', () => { const name = ['nf-outubro.pdf', 'clientes.csv', 'contrato.docx'][n++ % 3]; const c = document.createElement('span'); c.className = 'apc-chip'; c.innerHTML = `${name}<button type="button" aria-label="Remover anexo ${name}">×</button>`; files.append(c); live.textContent = `Anexo ${name} adicionado`; });
  files.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const c = b.closest('.apc-chip'); live.textContent = b.getAttribute('aria-label').replace('Remover anexo', 'Anexo') + ' removido'; c.remove(); t.focus(); });
  root.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); if (!t.value.trim()) return; const p = document.createElement('p'); p.className = 'apc-sent'; p.textContent = t.value; log.append(p); live.textContent = 'Mensagem enviada'; t.value = ''; files.innerHTML = ''; sync(); t.focus(); });
  sync();
})();
</script>
