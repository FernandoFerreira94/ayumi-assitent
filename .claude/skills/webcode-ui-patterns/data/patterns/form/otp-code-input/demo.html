<style>
  .otp { min-height: 100vh; display: grid; place-content: center; padding: 20px; text-align: center; }
  .otp-card { display: grid; gap: 14px; justify-items: center; width: min(380px, calc(100vw - 40px)); }
  .otp h2 { margin: 0; font: var(--wc-font-weight-semibold) var(--wc-font-size-xl) var(--wc-font-display); }
  .otp p { margin: 0; color: var(--wc-fg-muted); }
  .otp-wrap { position: relative; width: 100%; max-width: 320px; }
  .otp-wrap input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; caret-color: transparent; }
  .otp-boxes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; pointer-events: none; }
  .otp-boxes span { display: grid; place-items: center; aspect-ratio: 4 / 5; border: 1px solid var(--wc-border-strong); border-radius: var(--wc-radius-md); background: var(--wc-bg); font: var(--wc-font-weight-semibold) var(--wc-font-size-2xl) var(--wc-font-mono); font-variant-numeric: tabular-nums; transition: border-color var(--wc-motion-duration-fast), scale var(--wc-motion-duration-fast) var(--wc-motion-ease-out); }
  .otp-wrap:focus-within .otp-boxes span.is-current { border: 2px solid var(--wc-focus); }
  .otp-wrap:focus-within .otp-boxes span.is-current:empty::after { content: ""; width: 2px; height: 1.2em; background: var(--wc-fg); animation: otp-blink 1s steps(1) infinite; }
  .otp-boxes span.is-filled { scale: 1.03; }
  .otp.is-error .otp-boxes span { border-color: var(--wc-danger); }
  .otp.is-loading .otp-boxes span { opacity: .6; }
  @keyframes otp-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .otp-boxes span.is-filled { scale: 1; } .otp-wrap:focus-within .otp-boxes span.is-current:empty::after { animation: none; } }
  .otp-status { min-height: 1.4em; font-size: var(--wc-font-size-sm); color: var(--wc-fg-muted); }
  .otp.is-error .otp-status { color: var(--wc-danger); }
  .otp.is-ok .otp-status { color: var(--wc-success); }
  .otp-resend { font: inherit; min-height: var(--wc-size-touch-min); padding: 0 12px; border: 0; background: none; color: var(--wc-accent); cursor: pointer; }
  .otp-resend:disabled { color: var(--wc-fg-muted); cursor: default; }
  .otp-resend:focus-visible { outline: 2px solid var(--wc-focus); border-radius: var(--wc-radius-sm); }
  .otp small { color: var(--wc-fg-muted); }
</style>
<div class="otp">
  <div class="otp-card">
    <h2>Confirme seu celular</h2>
    <p>Enviamos um código por SMS para (11) •••••-4321.</p>
    <label class="otp-wrap" for="otp-input">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Código de 6 dígitos</span>
      <input id="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-describedby="otp-status">
      <span class="otp-boxes" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></span>
    </label>
    <span class="otp-status" id="otp-status" role="status"></span>
    <button class="otp-resend" type="button" disabled>Reenviar código em 30s</button>
    <small>Para testar: 246810 confirma; qualquer outro mostra erro.</small>
  </div>
</div>
<script>
(() => {
  const root = document.querySelector('.otp');
  const input = document.getElementById('otp-input');
  const boxes = [...root.querySelectorAll('.otp-boxes span')];
  const status = document.getElementById('otp-status');
  const resend = root.querySelector('.otp-resend');
  let timer;
  const paint = () => {
    const v = input.value;
    boxes.forEach((b, i) => { b.textContent = v[i] ?? ''; b.classList.toggle('is-filled', !!v[i]); b.classList.toggle('is-current', i === Math.min(v.length, 5)); });
  };
  const countdown = () => {
    let s = 30; resend.disabled = true; resend.textContent = `Reenviar código em ${s}s`;
    clearInterval(timer);
    timer = setInterval(() => { s--; resend.textContent = s > 0 ? `Reenviar código em ${s}s` : 'Reenviar código'; if (s <= 0) { resend.disabled = false; clearInterval(timer); } }, 1000);
  };
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    root.classList.remove('is-error', 'is-ok');
    status.textContent = '';
    paint();
    if (input.value.length === 6) {
      root.classList.add('is-loading'); status.textContent = 'Verificando…'; input.readOnly = true;
      setTimeout(() => {
        root.classList.remove('is-loading'); input.readOnly = false;
        if (input.value === '246810') { root.classList.add('is-ok'); status.textContent = 'Celular confirmado.'; input.blur(); }
        else { root.classList.add('is-error'); status.textContent = 'Código incorreto. Confira o SMS e digite de novo.'; input.value = ''; paint(); input.focus(); }
      }, 700);
    }
  });
  input.addEventListener('focus', paint);
  input.addEventListener('blur', paint);
  resend.addEventListener('click', () => { status.textContent = 'Novo código enviado por SMS.'; countdown(); input.focus(); });
  paint(); countdown();
})();
</script>
