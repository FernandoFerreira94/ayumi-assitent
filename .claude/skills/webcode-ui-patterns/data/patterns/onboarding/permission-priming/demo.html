<style>
  .pmp { min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--wc-fg); font-size: var(--wc-font-size-sm); }
  .pmp-card { width: min(380px, 100%); padding: 24px 20px; border-radius: var(--wc-radius-xl); background: var(--wc-surface); border: 1px solid var(--wc-border); box-shadow: var(--wc-shadow); display: grid; gap: 12px; text-align: center; }
  .pmp-ico { justify-self: center; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--wc-accent-soft); color: var(--wc-accent); }
  .pmp-card h3 { margin: 4px 0 0; font: var(--wc-font-weight-bold) var(--wc-font-size-xl) var(--wc-font-display); text-wrap: balance; }
  .pmp-card p { margin: 0; color: var(--wc-fg-muted); line-height: var(--wc-line-height-relaxed); }
  .pmp-card ul { margin: 4px 0; padding: 0; list-style: none; display: grid; gap: 8px; text-align: left; }
  .pmp-card li { display: flex; gap: 10px; } .pmp-card li::before { content: "✓"; color: var(--wc-success); font-weight: var(--wc-font-weight-bold); }
  .pmp-btn { min-height: 50px; border-radius: var(--wc-radius-button); border: 0; font: inherit; font-weight: var(--wc-font-weight-semibold); cursor: pointer; }
  .pmp-yes { background: var(--wc-accent-solid); color: var(--wc-accent-solid-fg); }
  .pmp-no { background: none; color: var(--wc-fg-muted); }
  .pmp-st { padding: 12px; border-radius: var(--wc-radius-md); text-align: left; }
  .pmp-st:empty { display: none; }
  .pmp-st.ok { background: var(--wc-success-soft); color: var(--wc-success); }
  .pmp-st.no { background: var(--wc-sunken); color: var(--wc-fg); }
  .pmp-sys { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--wc-scrim); }
  .pmp-sys[hidden] { display: none; }
  .pmp-sys > div { width: min(270px, 100%); border-radius: var(--wc-radius-lg); background: var(--wc-surface-raised); border: 1px solid var(--wc-border); text-align: center; overflow: hidden; }
  .pmp-sys small { display: block; padding-top: 10px; color: var(--wc-fg-muted); font-size: var(--wc-font-size-xs); }
  .pmp-sys h4 { margin: 6px 16px 4px; font-size: var(--wc-font-size-md); } .pmp-sys p { margin: 0 16px 14px; color: var(--wc-fg-muted); font-size: var(--wc-font-size-xs); }
  .pmp-sys div div { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--wc-border); }
  .pmp-sys button { min-height: 46px; border: 0; background: none; color: var(--wc-accent); font: inherit; font-size: var(--wc-font-size-md); cursor: pointer; }
  .pmp-sys button + button { border-left: 1px solid var(--wc-border); font-weight: var(--wc-font-weight-semibold); }
  .pmp-acts { display: grid; gap: 4px; } .pmp-acts[hidden] { display: none; }
  .pmp-reset { justify-self: center; min-height: 44px; padding: 0 12px; border: 0; background: none; color: var(--wc-accent); font: inherit; cursor: pointer; }
  .pmp button:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
</style>
<div class="pmp">
  <div class="pmp-card">
    <span class="pmp-ico" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
    <h3>Quer saber quando o técnico estiver chegando?</h3>
    <p>Sua OS #2041 está agendada para hoje, 9h30.</p>
    <ul><li>Aviso quando ele sair para a sua casa</li><li>Mudança de horário na hora</li><li>Nada de propaganda</li></ul>
    <div class="pmp-acts"><button type="button" class="pmp-btn pmp-yes">Ativar avisos</button><button type="button" class="pmp-btn pmp-no">Agora não</button></div>
    <div class="pmp-st" role="status"></div>
    <button type="button" class="pmp-reset" hidden>Recomeçar demonstração</button>
  </div>
  <div class="pmp-sys" role="alertdialog" aria-modal="true" aria-labelledby="pmp-sh" hidden><div><small>Simulação do diálogo do sistema</small><h4 id="pmp-sh">"Técnico Já" deseja enviar notificações</h4><p>Alertas, sons e ícones.</p><div><button type="button" data-a="deny">Não permitir</button><button type="button" data-a="allow">Permitir</button></div></div></div>
</div>
<script>
(() => {
  const root = document.querySelector('.pmp'), st = root.querySelector('.pmp-st'), sys = root.querySelector('.pmp-sys'), acts = root.querySelector('.pmp-acts'), reset = root.querySelector('.pmp-reset'), yes = root.querySelector('.pmp-yes');
  // Num app real: if ((await navigator.permissions.query({ name: 'notifications' })).state === 'prompt') await Notification.requestPermission()
  const end = (cls, html) => { acts.hidden = true; st.className = `pmp-st ${cls}`; st.innerHTML = html; reset.hidden = false; reset.focus(); };
  yes.onclick = () => { sys.hidden = false; sys.querySelector('[data-a="allow"]').focus(); };
  root.querySelector('.pmp-no').onclick = () => end('no', 'Tudo bem. Você ainda acompanha a OS pela tela <b>Ordens</b>. Para ativar depois: <b>Perfil › Avisos</b>.');
  sys.onclick = (e) => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return; sys.hidden = true;
    a === 'allow' ? end('ok', 'Avisos ativados. Mandamos uma mensagem quando o técnico sair.') : end('no', 'Avisos bloqueados no sistema. Para ativar: <b>Ajustes › Técnico Já › Notificações</b>. A OS continua visível no app.');
  };
  sys.addEventListener('keydown', (e) => { if (e.key === 'Escape') { sys.hidden = true; yes.focus(); } });
  reset.onclick = () => { acts.hidden = false; st.textContent = ''; st.className = 'pmp-st'; reset.hidden = true; yes.focus(); };
})();
</script>
