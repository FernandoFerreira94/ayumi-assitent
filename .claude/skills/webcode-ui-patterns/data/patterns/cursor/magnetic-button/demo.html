<style>
  .mb-stage { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 24px; padding: 20px; text-align: center; }
  .mb-stage p { color: var(--wc-fg-muted); margin: 0; }
  .mb-zone { padding: 40px; }
  .mb { --tx: 0px; --ty: 0px; position: relative; display: inline-grid; place-items: center; width: 168px; height: 168px; border-radius: 50%; background: var(--wc-accent-solid); color: var(--wc-accent-solid-fg); text-decoration: none; font: var(--wc-font-weight-semibold) var(--wc-font-size-lg) var(--wc-font-display); transform: translate(var(--tx), var(--ty)); transition: transform var(--wc-motion-spring-bouncy-duration) var(--wc-motion-spring-bouncy); box-shadow: var(--wc-shadow-lg); }
  .mb.is-active { transition: transform 120ms linear; }
  .mb span { display: block; transform: translate(calc(var(--tx) * .5), calc(var(--ty) * .5)); transition: inherit; }
  .mb:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 6px; }
</style>
<div class="mb-stage">
  <p>Aproxime o cursor do botão</p>
  <div class="mb-zone"><a class="mb" href="#"><span>Vamos conversar</span></a></div>
</div>
<script>
(() => {
  const btn = document.querySelector('.mb');
  const zone = document.querySelector('.mb-zone');
  if (!matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches) return;
  const strength = 0.35;
  let raf = 0;
  zone.addEventListener('pointermove', (e) => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const r = btn.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      btn.classList.add('is-active');
      btn.style.setProperty('--tx', dx * strength + 'px');
      btn.style.setProperty('--ty', dy * strength + 'px');
    });
  });
  zone.addEventListener('pointerleave', () => {
    cancelAnimationFrame(raf);
    btn.classList.remove('is-active');
    btn.style.setProperty('--tx', '0px');
    btn.style.setProperty('--ty', '0px');
  });
})();
</script>
