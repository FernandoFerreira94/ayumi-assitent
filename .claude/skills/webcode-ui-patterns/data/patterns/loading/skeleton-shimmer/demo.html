<style>
  .sk-wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
  .sk-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sk-head h2 { font: var(--wc-font-weight-semibold) var(--wc-font-size-xl) var(--wc-font-display); margin: 0; }
  .sk-head button { font: inherit; font-size: var(--wc-font-size-sm); padding: 6px 12px; border-radius: var(--wc-radius-md); border: 1px solid var(--wc-border-strong); background: var(--wc-surface); color: var(--wc-fg); cursor: pointer; }
  .sk-head button:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
  .sk-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--wc-border); border-radius: var(--wc-radius-lg); background: var(--wc-surface); overflow: hidden; }
  .sk-list li { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; min-height: 68px; }
  .sk-list li + li { border-top: 1px solid var(--wc-border); }
  .sk-b { position: relative; overflow: hidden; background: var(--wc-sunken); border-radius: var(--wc-radius-sm); height: 12px; }
  .sk-b::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--wc-surface), transparent); opacity: .6; transform: translateX(-100%); animation: sk-shine 1.4s var(--wc-motion-ease-in-out) infinite; }
  @keyframes sk-shine { to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { .sk-b::after { animation: none; } }
  .sk-av { width: 40px; height: 40px; border-radius: 50%; }
  .sk-lines { display: grid; gap: 8px; }
  .sk-list[data-state="loading"] .sk-real, .sk-list[data-state="ready"] .sk-ghost { display: none; }
  .sk-list[data-state="ready"] li { animation: sk-in var(--wc-motion-duration-base) var(--wc-motion-ease-out) both; animation-delay: calc(var(--i) * var(--wc-motion-duration-stagger)); }
  @keyframes sk-in { from { opacity: 0; transform: translateY(calc(4px * var(--wc-motion-distance))); } }
  .sk-real .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--wc-accent-soft); color: var(--wc-accent); font-weight: var(--wc-font-weight-semibold); font-size: var(--wc-font-size-sm); }
  .sk-real strong { display: block; font-weight: var(--wc-font-weight-medium); }
  .sk-real small { color: var(--wc-fg-muted); }
  .sk-real .val { font-variant-numeric: tabular-nums; font-weight: var(--wc-font-weight-semibold); }
  .sk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<div class="sk-wrap">
  <div class="sk-head"><h2>Últimos pedidos</h2><button type="button" id="sk-reload">Recarregar</button></div>
  <ul class="sk-list" data-state="loading" aria-busy="true">
    <li class="sk-ghost" aria-hidden="true"><span class="sk-b sk-av"></span><span class="sk-lines"><span class="sk-b" style="width:60%"></span><span class="sk-b" style="width:35%"></span></span><span class="sk-b" style="width:64px"></span></li>
    <li class="sk-ghost" aria-hidden="true"><span class="sk-b sk-av"></span><span class="sk-lines"><span class="sk-b" style="width:72%"></span><span class="sk-b" style="width:28%"></span></span><span class="sk-b" style="width:56px"></span></li>
    <li class="sk-ghost" aria-hidden="true"><span class="sk-b sk-av"></span><span class="sk-lines"><span class="sk-b" style="width:52%"></span><span class="sk-b" style="width:40%"></span></span><span class="sk-b" style="width:70px"></span></li>
    <li class="sk-real" style="--i:0"><span class="av">AL</span><span><strong>Ana Lima</strong><small>#10482 · Pix · há 2 min</small></span><span class="val">R$ 389,90</span></li>
    <li class="sk-real" style="--i:1"><span class="av">RM</span><span><strong>Rafael Moura</strong><small>#10481 · Cartão 3x · há 9 min</small></span><span class="val">R$ 1.240,00</span></li>
    <li class="sk-real" style="--i:2"><span class="av">JS</span><span><strong>Júlia Santos</strong><small>#10480 · Boleto · há 21 min</small></span><span class="val">R$ 96,50</span></li>
  </ul>
  <p class="sk-sr" aria-live="polite" id="sk-status"></p>
</div>
<script>
(() => {
  const list = document.querySelector('.sk-list');
  const status = document.getElementById('sk-status');
  const load = () => {
    list.dataset.state = 'loading'; list.setAttribute('aria-busy', 'true'); status.textContent = '';
    setTimeout(() => { list.dataset.state = 'ready'; list.setAttribute('aria-busy', 'false'); status.textContent = 'Pedidos carregados'; }, 1600);
  };
  document.getElementById('sk-reload').addEventListener('click', load);
  load();
})();
</script>
