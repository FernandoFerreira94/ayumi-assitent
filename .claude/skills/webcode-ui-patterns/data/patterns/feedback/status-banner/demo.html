<style>
  .stb { min-height: 100vh; padding: 20px; display: grid; gap: 12px; align-content: start; max-width: 760px; }
  .stb-b { display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px 12px 16px; border-radius: var(--wc-radius-md); border: 1px solid var(--wc-border); font-size: var(--wc-font-size-sm); }
  .stb-b[data-tone="info"] { background: var(--wc-accent-soft); } .stb-b[data-tone="info"] .stb-i { color: var(--wc-accent); }
  .stb-b[data-tone="ok"] { background: var(--wc-success-soft); } .stb-b[data-tone="ok"] .stb-i { color: var(--wc-success); }
  .stb-b[data-tone="warn"] { background: var(--wc-warning-soft); } .stb-b[data-tone="warn"] .stb-i { color: var(--wc-warning); }
  .stb-b[data-tone="error"] { background: var(--wc-danger-soft); border-color: var(--wc-danger); } .stb-b[data-tone="error"] .stb-i { color: var(--wc-danger); }
  .stb-i { flex: none; width: 20px; height: 20px; margin-top: 1px; }
  .stb-t { flex: 1; min-width: 0; line-height: var(--wc-line-height-snug); padding-top: 2px; }
  .stb-t b { font-weight: var(--wc-font-weight-semibold); }
  .stb-act { flex: none; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .stb-act a, .stb-act button { min-height: 32px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: var(--wc-radius-sm); font: inherit; font-weight: var(--wc-font-weight-semibold); color: var(--wc-fg); background: var(--wc-surface); border: 1px solid var(--wc-border-strong); text-decoration: none; cursor: pointer; }
  .stb-act .stb-x { width: 32px; padding: 0; justify-content: center; border-color: transparent; background: transparent; color: var(--wc-fg-muted); }
  .stb-act a:focus-visible, .stb-act button:focus-visible, .stb-reset:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
  .stb-b.is-leaving { opacity: 0; translate: 0 calc(-4px * var(--wc-motion-distance)); transition: opacity var(--wc-motion-duration-fast), translate var(--wc-motion-duration-fast); }
  @media (max-width: 520px) { .stb-b { flex-wrap: wrap; } .stb-act { width: 100%; padding-left: 32px; } }
  .stb-reset { justify-self: start; font: inherit; font-size: var(--wc-font-size-sm); color: var(--wc-accent); background: none; border: 0; padding: 4px; cursor: pointer; text-decoration: underline; }
</style>
<div class="stb"></div>
<script>
(() => {
  const ICON = { info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', ok: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>', warn: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>', error: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>' };
  const PREFIX = { info: 'Informação:', ok: 'Pronto:', warn: 'Atenção:', error: 'Erro:' };
  const items = [
    { id: 'wpp-v2', tone: 'error', text: '<b>O WhatsApp desconectou.</b> Mensagens novas não estão chegando.', action: 'Reconectar', dismiss: false },
    { id: 'cota-v3', tone: 'warn', text: '<b>Você usou 82% das execuções do mês.</b> Ao chegar em 100%, as automações pausam até 01/11.', action: 'Ver planos', dismiss: true },
    { id: 'import-v1', tone: 'ok', text: '<b>Importação concluída:</b> 1.240 clientes, 12 ignorados por CPF duplicado.', action: 'Ver ignorados', dismiss: true },
    { id: 'manut-v1', tone: 'info', text: 'Manutenção programada no domingo, 02/11, das 2h às 4h. O sistema fica só leitura.', action: null, dismiss: true },
  ];
  const root = document.querySelector('.stb');
  const isDismissed = (id) => { try { return localStorage.getItem('wc-banner-' + id) === '1'; } catch { return false; } };
  const render = () => {
    root.innerHTML = items.filter((b) => !isDismissed(b.id)).map((b) => `<div class="stb-b" data-tone="${b.tone}" data-id="${b.id}" role="${b.tone === 'error' ? 'alert' : 'status'}"><svg class="stb-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[b.tone]}</svg><p class="stb-t" style="margin:0"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">${PREFIX[b.tone]} </span>${b.text}</p><div class="stb-act">${b.action ? `<a href="#${b.id}">${b.action}</a>` : ''}${b.dismiss ? '<button type="button" class="stb-x" aria-label="Dispensar aviso">×</button>' : ''}</div></div>`).join('') + '<button type="button" class="stb-reset">Mostrar avisos dispensados (demo)</button>';
  };
  root.addEventListener('click', (e) => {
    if (e.target.closest('.stb-reset')) { items.forEach((b) => { try { localStorage.removeItem('wc-banner-' + b.id); } catch {} }); render(); return; }
    const x = e.target.closest('.stb-x'); if (!x) return;
    const b = x.closest('.stb-b');
    try { localStorage.setItem('wc-banner-' + b.dataset.id, '1'); } catch {}
    const next = b.nextElementSibling;
    b.classList.add('is-leaving');
    setTimeout(() => { b.remove(); (next?.querySelector('a, button') ?? root.querySelector('button'))?.focus(); }, 160);
  });
  render();
})();
</script>
