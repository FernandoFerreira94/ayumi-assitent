<style>
  .abs { min-height: 100vh; padding: 24px 20px; display: grid; gap: 20px; align-content: start; max-width: 560px; font-size: var(--wc-font-size-sm); color: var(--wc-fg); }
  .abs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .abs-btn { display: inline-grid; align-items: center; justify-items: center; min-height: 44px; padding: 0 18px; border-radius: var(--wc-radius-md); border: 0; font: inherit; font-weight: var(--wc-font-weight-semibold); color: var(--wc-accent-solid-fg); background: var(--wc-accent-solid); cursor: pointer; transition: background-color var(--wc-motion-duration-fast), scale var(--wc-motion-duration-instant); }
  .abs-btn:active { scale: .98; }
  .abs-btn:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
  .abs-btn > span { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 8px; visibility: hidden; }
  .abs-btn[data-state="idle"] .l-idle, .abs-btn[data-state="loading"] .l-loading, .abs-btn[data-state="ok"] .l-ok, .abs-btn[data-state="error"] .l-error { visibility: visible; }
  .abs-btn[data-state="loading"] { cursor: progress; }
  .abs-btn[data-state="ok"] { background: var(--wc-success-soft); color: var(--wc-fg); box-shadow: inset 0 0 0 1px var(--wc-success); } .abs-btn[data-state="ok"] svg { color: var(--wc-success); }
  .abs-btn[data-state="error"] { background: var(--wc-danger-solid); color: var(--wc-danger-solid-fg); }
  .abs-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; }
  /* Só gira enquanto carrega (escondido por visibility a animação continuaria rodando). */
  .abs-btn[data-state="loading"] .abs-spin { animation: abs-r .7s linear infinite; }
  @keyframes abs-r { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .abs-spin { animation-duration: 2s; } }
  .abs-msg { color: var(--wc-danger); min-height: 1.4em; margin: 0; }
  .abs-opt { display: flex; gap: 8px; align-items: center; color: var(--wc-fg-muted); }
  .abs-opt input { width: 18px; height: 18px; accent-color: var(--wc-accent-solid); }
  .abs-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  h3 { margin: 0; font-size: var(--wc-font-size-md); }
</style>
<div class="abs">
  <h3>Dados da empresa</h3>
  <div class="abs-row">
    <button type="button" class="abs-btn" data-state="idle">
      <span class="l-idle">Salvar alterações</span>
      <span class="l-loading" aria-hidden="true"><i class="abs-spin"></i>Salvando…</span>
      <span class="l-ok" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>Salvo</span>
      <span class="l-error" aria-hidden="true">Tentar de novo</span>
    </button>
    <p class="abs-msg" id="abs-msg"></p>
  </div>
  <label class="abs-opt"><input type="checkbox" id="abs-fail"> Simular falha de rede</label>
  <p class="abs-sr" role="status" id="abs-live"></p>
</div>
<script>
(() => {
  const btn = document.querySelector('.abs-btn'), msg = document.getElementById('abs-msg'), live = document.getElementById('abs-live'), fail = document.getElementById('abs-fail');
  const label = { idle: 'Salvar alterações', loading: 'Salvando…', ok: 'Salvo', error: 'Tentar de novo' };
  let t;
  const set = (s) => { btn.dataset.state = s; btn.setAttribute('aria-label', label[s]); btn.toggleAttribute('aria-disabled', s === 'loading'); };
  btn.addEventListener('click', () => {
    if (btn.dataset.state === 'loading') return;
    clearTimeout(t); msg.textContent = '';
    const spin = setTimeout(() => { set('loading'); live.textContent = 'Salvando'; }, 200);
    btn.setAttribute('aria-disabled', '');
    setTimeout(() => {
      clearTimeout(spin);
      if (fail.checked) { set('error'); msg.textContent = 'Sem conexão. Nada foi perdido.'; live.textContent = 'Erro: sem conexão. Nada foi perdido.'; return; }
      set('ok'); live.textContent = 'Alterações salvas';
      t = setTimeout(() => set('idle'), 2000);
    }, 1400);
  });
  set('idle');
})();
</script>
