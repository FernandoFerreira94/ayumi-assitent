<style>
  .sgc { min-height: 100vh; padding: 24px 16px; display: grid; gap: 22px; align-content: start; max-width: 520px; color: var(--wc-fg); font-size: var(--wc-font-size-sm); font-variant-numeric: tabular-nums; }
  .sgc fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .sgc legend { padding: 0; margin-bottom: 8px; color: var(--wc-fg-muted); }
  .sgc-track { position: relative; display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; padding: 3px; border-radius: var(--wc-radius-md); background: var(--wc-sunken); }
  .sgc-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: calc(var(--wc-radius-md) - 3px); background: var(--wc-surface-raised); box-shadow: var(--wc-shadow); transition: translate var(--wc-motion-spring-snappy-duration) var(--wc-motion-spring-snappy), width var(--wc-motion-spring-snappy-duration) var(--wc-motion-spring-snappy); }
  .sgc-track.no-anim .sgc-thumb { transition: none; }
  .sgc label { position: relative; z-index: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 10px; border-radius: calc(var(--wc-radius-md) - 3px); cursor: pointer; color: var(--wc-fg-muted); font-weight: var(--wc-font-weight-medium, 500); white-space: nowrap; transition: color var(--wc-motion-duration-fast); }
  @media (pointer: coarse) { .sgc label { min-height: 44px; } }
  .sgc input { position: absolute; opacity: 0; pointer-events: none; }
  .sgc label:has(:checked) { color: var(--wc-fg); font-weight: var(--wc-font-weight-semibold); }
  .sgc label:has(:focus-visible) { outline: 2px solid var(--wc-focus); outline-offset: 1px; }
  .sgc-badge { margin-left: 6px; padding: 1px 6px; border-radius: var(--wc-radius-pill); background: var(--wc-success-soft); font-size: var(--wc-font-size-xs); color: var(--wc-fg); }
  .sgc-out { padding: 16px; border: 1px solid var(--wc-border); border-radius: var(--wc-radius-lg); background: var(--wc-surface); display: grid; gap: 6px; }
  .sgc-out strong { font-size: var(--wc-font-size-xl); }
  .sgc-out span { color: var(--wc-fg-muted); }
  .sgc-bars { display: flex; align-items: end; gap: 4px; height: 64px; }
  .sgc-bars i { flex: 1; border-radius: 3px 3px 0 0; background: var(--wc-accent); opacity: .75; transition: height var(--wc-motion-duration-base) var(--wc-motion-ease-out); }
  @media (prefers-reduced-motion: reduce) { .sgc-thumb, .sgc-bars i { transition: none; } }
</style>
<div class="sgc">
  <fieldset>
    <legend>Período</legend>
    <div class="sgc-track" data-g="per"><span class="sgc-thumb" aria-hidden="true"></span>
      <label><input type="radio" name="per" value="d">Dia</label><label><input type="radio" name="per" value="s" checked>Semana</label><label><input type="radio" name="per" value="m">Mês</label><label><input type="radio" name="per" value="a">Ano</label>
    </div>
  </fieldset>
  <section class="sgc-out" aria-labelledby="sgc-h"><span id="sgc-h">Passos</span><strong class="sgc-v"></strong><div class="sgc-bars" aria-hidden="true"></div></section>
  <fieldset>
    <legend>Cobrança</legend>
    <div class="sgc-track" data-g="plan"><span class="sgc-thumb" aria-hidden="true"></span>
      <label><input type="radio" name="plan" value="m" checked>Mensal</label><label><input type="radio" name="plan" value="a">Anual<span class="sgc-badge">−20%</span></label>
    </div>
  </fieldset>
  <p class="sgc-price" style="margin:0"></p>
</div>
<script>
(() => {
  const place = (track, anim = true) => {
    const th = track.querySelector('.sgc-thumb'), lb = track.querySelector('label:has(:checked)'); if (!lb) return;
    track.classList.toggle('no-anim', !anim);
    th.style.width = lb.offsetWidth + 'px'; th.style.translate = lb.offsetLeft + 'px 0';
  };
  const DATA = { d: [24, 8, 30, 52, 40, 66, 20, 12], s: [62, 71, 48, 80, 55, 90, 73], m: [40, 55, 62, 48, 70, 66, 58, 75, 60, 52, 68, 72], a: [50, 58, 61, 66, 70, 64, 72, 75, 69, 77, 80, 83] };
  const TOT = { d: '8.214 passos hoje', s: '61.402 passos na semana', m: '248.930 passos no mês', a: '2,9 mi passos no ano' };
  const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const upd = () => {
    const per = document.querySelector('[name=per]:checked').value, plan = document.querySelector('[name=plan]:checked').value;
    document.querySelector('.sgc-v').textContent = TOT[per];
    const bars = document.querySelector('.sgc-bars'), d = DATA[per]; bars.innerHTML = d.map(() => '<i style="height:0"></i>').join('');
    requestAnimationFrame(() => bars.querySelectorAll('i').forEach((b, k) => (b.style.height = d[k] + '%')));
    document.querySelector('.sgc-price').textContent = plan === 'a' ? `${fmt(39.9 * 12 * .8)} por ano (equivale a ${fmt(39.9 * .8)}/mês)` : `${fmt(39.9)} por mês`;
  };
  const tracks = document.querySelectorAll('.sgc-track');
  tracks.forEach((t) => { place(t, false); t.addEventListener('change', () => { place(t); upd(); }); });
  new ResizeObserver(() => tracks.forEach((t) => place(t, false))).observe(document.querySelector('.sgc'));
  upd();
})();
</script>
