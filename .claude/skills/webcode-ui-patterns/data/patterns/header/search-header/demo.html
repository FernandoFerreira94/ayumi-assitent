<style>
  .sh { position: sticky; top: 0; z-index: 10; background: var(--wc-surface); border-bottom: 1px solid var(--wc-border); }
  .sh-top { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "logo search actions"; align-items: center; gap: 12px 24px; }
  .sh-logo { grid-area: logo; font: var(--wc-font-weight-bold) var(--wc-font-size-xl) var(--wc-font-display); color: var(--wc-fg); text-decoration: none; letter-spacing: calc(var(--wc-tracking-tight) * 1em); }
  .sh-logo span { color: var(--wc-accent); }
  .sh-search { grid-area: search; position: relative; max-width: 640px; width: 100%; justify-self: center; }
  .sh-search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--wc-fg-muted); pointer-events: none; }
  .sh-search input { width: 100%; height: var(--wc-size-control-lg); padding: 0 16px 0 42px; border-radius: var(--wc-radius-pill); border: 1px solid var(--wc-border-strong); background: var(--wc-sunken); color: var(--wc-fg); font: inherit; }
  .sh-search input:focus { outline: 2px solid var(--wc-focus); outline-offset: 1px; background: var(--wc-surface); }
  .sh-list ul { list-style: none; margin: 0; padding: 0; }
  .sh-list p { margin: 0; }
  .sh-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; background: var(--wc-surface-raised); border: 1px solid var(--wc-border); border-radius: var(--wc-radius-lg); box-shadow: var(--wc-shadow-lg); z-index: 5; }
  .sh-list[hidden] { display: none; }
  .sh-list .sh-group { font-size: var(--wc-font-size-xs); color: var(--wc-fg-muted); padding: 6px 10px 4px; text-transform: uppercase; letter-spacing: calc(var(--wc-tracking-caps) * 1em); }
  .sh-list [role="option"] { padding: 9px 10px; border-radius: var(--wc-radius-sm); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .sh-list [role="option"][aria-selected="true"] { background: var(--wc-accent-soft); }
  .sh-list mark { background: none; color: var(--wc-fg); font-weight: var(--wc-font-weight-semibold); }
  .sh-list small { margin-left: auto; color: var(--wc-fg-muted); font-size: var(--wc-font-size-xs); }
  .sh-actions { grid-area: actions; display: flex; gap: 4px; }
  .sh-actions a { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--wc-radius-pill); color: var(--wc-fg); }
  .sh-actions a:hover { background: var(--wc-sunken); }
  .sh-badge { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--wc-accent-solid); color: var(--wc-accent-solid-fg); font-size: 11px; font-weight: var(--wc-font-weight-bold); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .sh-badge.bump { animation: sh-bump var(--wc-motion-spring-bouncy-duration) var(--wc-motion-spring-bouncy); }
  @keyframes sh-bump { 40% { scale: calc(1 + .35 * var(--wc-motion-distance)); } }
  .sh a:focus-visible, .sh button:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
  .sh-cats { max-width: 1200px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }
  .sh-cats a { scroll-snap-align: start; white-space: nowrap; padding: 10px 10px 12px; font-size: var(--wc-font-size-sm); color: var(--wc-fg-muted); text-decoration: none; border-bottom: 2px solid transparent; }
  .sh-cats a:hover { color: var(--wc-fg); }
  .sh-cats a[aria-current] { color: var(--wc-fg); border-bottom-color: var(--wc-accent); font-weight: var(--wc-font-weight-medium); }
  .sh-cats a.sh-promo { color: var(--wc-danger); font-weight: var(--wc-font-weight-semibold); }
  @media (max-width: 720px) { .sh-top { grid-template-columns: 1fr auto; grid-template-areas: "logo actions" "search search"; } .sh-search { max-width: none; } }
  .sh-page { max-width: 1200px; margin: 0 auto; padding: 24px 20px 400px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .sh-page div { aspect-ratio: 3/4; border-radius: var(--wc-radius-lg); background: var(--wc-sunken); border: 1px solid var(--wc-border); }
  .sh-add { font: inherit; font-size: var(--wc-font-size-sm); margin: 16px 20px 0; padding: 8px 14px; border-radius: var(--wc-radius-button); border: 1px solid var(--wc-border-strong); background: var(--wc-surface); color: var(--wc-fg); cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
<header class="sh">
  <div class="sh-top">
    <a class="sh-logo" href="#">casa<span>.</span>viva</a>
    <div class="sh-search" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="sh-q">Buscar produtos</label>
      <input id="sh-q" type="search" placeholder="Buscar produtos, marcas e categorias" role="combobox" aria-expanded="false" aria-controls="sh-list" aria-autocomplete="list" autocomplete="off">
      <div class="sh-list" hidden><p class="sh-group" id="sh-group"></p><ul id="sh-list" role="listbox" aria-labelledby="sh-group"></ul></div>
    </div>
    <div class="sh-actions">
      <a href="#" aria-label="Minha conta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
      <a href="#" aria-label="Favoritos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></a>
      <a href="#" class="sh-cart" aria-label="Sacola, 2 itens"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 12H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="sh-badge" aria-hidden="true">2</span></a>
    </div>
  </div>
  <nav class="sh-cats" aria-label="Categorias">
    <a href="#" class="sh-promo">Ofertas do dia</a><a href="#" aria-current="page">Cozinha</a><a href="#">Quarto</a><a href="#">Banho</a><a href="#">Sala</a><a href="#">Decoração</a><a href="#">Iluminação</a><a href="#">Jardim</a><a href="#">Organização</a><a href="#">Eletroportáteis</a>
  </nav>
</header>
<button class="sh-add" type="button">Adicionar item à sacola</button>
<main class="sh-page"><h1 class="sr">Cozinha</h1><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></main>
<script>
(() => {
  const RECENT = ['jogo de panelas', 'air fryer'];
  const ALL = [['Panela de pressão inox 6L', 'Cozinha'], ['Panela antiaderente 24cm', 'Cozinha'], ['Jogo de panelas cerâmica', 'Cozinha'], ['Painel de LED para sala', 'Iluminação'], ['Pano de prato bordado', 'Cozinha'], ['Lençol percal 400 fios', 'Quarto'], ['Luminária de mesa articulada', 'Iluminação'], ['Toalha de banho fio penteado', 'Banho'], ['Air fryer 4L digital', 'Eletroportáteis'], ['Cafeteira italiana 6 xícaras', 'Cozinha']];
  const q = document.getElementById('sh-q'), list = document.getElementById('sh-list'), pop = list.parentElement, group = document.getElementById('sh-group');
  let items = [], active = -1;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function render() {
    const v = q.value.trim();
    if (!v) { items = RECENT.map((t) => [t, '']); group.textContent = 'Buscas recentes'; }
    else { const n = norm(v); items = ALL.filter(([t]) => norm(t).includes(n)).slice(0, 6); group.textContent = items.length ? 'Sugestões' : `Nada encontrado para “${v}”`; }
    list.innerHTML = items.map(([t, c], i) => {
      const at = norm(t).indexOf(norm(v));
      const label = v && at >= 0 ? esc(t.slice(0, at)) + '<mark>' + esc(t.slice(at, at + v.length)) + '</mark>' + esc(t.slice(at + v.length)) : esc(t);
      return `<li role="option" id="sh-o${i}" aria-selected="false">${label}${c ? `<small>em ${c}</small>` : ''}</li>`;
    }).join('');
    active = -1; q.removeAttribute('aria-activedescendant'); show(true);
  }
  function show(on) { pop.hidden = !on; q.setAttribute('aria-expanded', String(on)); }
  function move(d) {
    if (!items.length) return;
    active = (active + d + items.length) % items.length;
    list.querySelectorAll('[role="option"]').forEach((o, i) => o.setAttribute('aria-selected', String(i === active)));
    q.setAttribute('aria-activedescendant', 'sh-o' + active);
    document.getElementById('sh-o' + active).scrollIntoView({ block: 'nearest' });
  }
  function choose(i) { if (i < 0) return; q.value = items[i][0]; show(false); }
  q.addEventListener('focus', render);
  q.addEventListener('input', render);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (pop.hidden) render(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { if (active >= 0) { e.preventDefault(); choose(active); } else show(false); }
    else if (e.key === 'Escape') { if (!pop.hidden) show(false); else q.value = ''; }
  });
  q.addEventListener('blur', () => setTimeout(() => show(false), 120));
  list.addEventListener('pointerdown', (e) => { const o = e.target.closest('[role="option"]'); if (o) { e.preventDefault(); choose(+o.id.slice(4)); } });
  const cart = document.querySelector('.sh-cart'), badge = cart.querySelector('.sh-badge');
  document.querySelector('.sh-add').addEventListener('click', () => {
    const n = +badge.textContent + 1; badge.textContent = n; cart.setAttribute('aria-label', `Sacola, ${n} itens`);
    badge.classList.remove('bump'); void badge.offsetWidth; badge.classList.add('bump');
  });
})();
</script>
