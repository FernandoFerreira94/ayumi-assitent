<style>
  .lcc { min-height: 100vh; padding: 20px 16px; max-width: 860px; margin: 0 auto; display: grid; gap: 12px; align-content: start; color: var(--wc-fg); font-size: var(--wc-font-size-sm); font-variant-numeric: tabular-nums; }
  .lcc-card { border: 1px solid var(--wc-border); border-radius: var(--wc-radius-lg); background: var(--wc-surface); padding: 16px; display: grid; gap: 10px; }
  .lcc h3 { margin: 0; font-size: var(--wc-font-size-md); }
  .lcc-sub { margin: 0; color: var(--wc-fg-muted); }
  .lcc-leg { display: flex; flex-wrap: wrap; gap: 14px; color: var(--wc-fg-muted); font-size: var(--wc-font-size-xs); }
  .lcc-leg span { display: inline-flex; align-items: center; gap: 6px; }
  .lcc-leg i { width: 16px; height: 0; border-top: 2px solid var(--wc-accent); }
  .lcc-leg i.cmp { border-top: 2px dashed var(--wc-fg-muted); }
  .lcc-plot { position: relative; touch-action: pan-y; border-radius: var(--wc-radius-sm); }
  .lcc-plot:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 4px; }
  .lcc svg { display: block; width: 100%; height: 260px; overflow: visible; }
  .lcc .grid line { stroke: var(--wc-border); }
  .lcc .ax text { fill: var(--wc-fg-muted); font-size: 11px; }
  .lcc .area { fill: color-mix(in oklab, var(--wc-accent) 14%, transparent); }
  .lcc .main { fill: none; stroke: var(--wc-accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .lcc .cmp { fill: none; stroke: var(--wc-fg-muted); stroke-width: 2; stroke-dasharray: 4 4; stroke-linecap: round; }
  .lcc .lbl { font-size: 11px; fill: var(--wc-fg-muted); }
  .lcc .lbl.m { fill: var(--wc-fg); font-weight: 600; }
  .lcc .xh line { stroke: var(--wc-border-strong); }
  .lcc .xh circle { stroke: var(--wc-surface); stroke-width: 2; }
  .lcc .xh .pm { fill: var(--wc-accent); } .lcc .xh .pc { fill: var(--wc-fg-muted); }
  .lcc .xh { opacity: 0; transition: opacity var(--wc-motion-duration-instant); }
  .lcc-plot.is-on .xh { opacity: 1; }
  .lcc-tip { position: absolute; top: 0; left: 0; pointer-events: none; min-width: 150px; padding: 8px 10px; border-radius: var(--wc-radius-md); background: var(--wc-surface); border: 1px solid var(--wc-border); box-shadow: var(--wc-shadow-lg); font-size: var(--wc-font-size-xs); display: grid; gap: 4px; opacity: 0; transition: opacity var(--wc-motion-duration-instant); }
  .lcc-plot.is-on .lcc-tip { opacity: 1; }
  .lcc-tip b { font-size: var(--wc-font-size-sm); }
  .lcc-tip span { display: flex; justify-content: space-between; gap: 12px; color: var(--wc-fg-muted); }
  .lcc-tip span em { font-style: normal; color: var(--wc-fg); }
  .lcc details summary { cursor: pointer; color: var(--wc-accent); min-height: 32px; display: inline-flex; align-items: center; }
  .lcc details summary:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
  .lcc table { width: 100%; border-collapse: collapse; font-size: var(--wc-font-size-xs); }
  .lcc th, .lcc td { padding: 6px 8px; border-bottom: 1px solid var(--wc-border); text-align: right; }
  .lcc th:first-child, .lcc td:first-child { text-align: left; }
  .lcc-wrap { max-height: 220px; overflow: auto; }
</style>
<div class="lcc">
  <section class="lcc-card" aria-labelledby="lcc-h">
    <h3 id="lcc-h">Vendas de outubro cresceram 18% sobre setembro</h3>
    <p class="lcc-sub">Receita diária, em reais</p>
    <div class="lcc-leg" aria-hidden="true"><span><i></i>Outubro</span><span><i class="cmp"></i>Setembro</span></div>
    <div class="lcc-plot" tabindex="0" aria-describedby="lcc-hint"><svg role="img"></svg><div class="lcc-tip" aria-hidden="true"></div></div>
    <p id="lcc-hint" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Use as setas para percorrer os dias.</p>
    <p role="status" class="lcc-live" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>
    <details><summary>Ver dados em tabela</summary><div class="lcc-wrap"><table><thead><tr><th scope="col">Dia</th><th scope="col">Outubro</th><th scope="col">Setembro</th></tr></thead><tbody></tbody></table></div></details>
  </section>
</div>
<script>
(() => {
  const N = 31, seed = (s) => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const r1 = seed(11), r2 = seed(5);
  const cur = Array.from({ length: N }, (_, i) => Math.round(5200 + i * 60 + Math.sin(i / 2.3) * 900 + (i % 7 === 5 || i % 7 === 6 ? 1400 : 0) + r1() * 700));
  const prev = Array.from({ length: N }, (_, i) => Math.round(4700 + i * 30 + Math.sin(i / 2.6) * 700 + (i % 7 === 4 || i % 7 === 5 ? 1100 : 0) + r2() * 600)).map((v, i) => (i < 30 ? v : null));
  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const short = (v) => v >= 1000 ? `R$ ${(v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mil` : `R$ ${v}`;
  const day = (i) => new Date(2026, 9, i + 1);
  const fd = (i, o) => day(i).toLocaleDateString('pt-BR', o);
  const root = document.querySelector('.lcc'), plot = root.querySelector('.lcc-plot'), svg = plot.querySelector('svg'), tip = plot.querySelector('.lcc-tip'), live = root.querySelector('.lcc-live');
  const sum = (a) => a.reduce((t, v) => t + (v ?? 0), 0), grow = Math.round((sum(cur) / sum(prev) - 1) * 100);
  root.querySelector('#lcc-h').textContent = `Vendas de outubro ${grow >= 0 ? 'cresceram' : 'caíram'} ${Math.abs(grow)}% sobre setembro`;
  svg.setAttribute('aria-label', `Linha da receita diária de outubro, de ${brl.format(cur[0])} no dia 1 a ${brl.format(cur[N - 1])} no dia 31, acima de setembro na maior parte do mês.`);
  root.querySelector('tbody').innerHTML = cur.map((v, i) => `<tr><td>${fd(i, { day: 'numeric', month: 'short' })}</td><td>${brl.format(v)}</td><td>${prev[i] == null ? '—' : brl.format(prev[i])}</td></tr>`).join('');
  const nice = (max) => { const e = 10 ** Math.floor(Math.log10(max / 4)); const s = [1, 2, 2.5, 5, 10].map((k) => k * e).find((k) => max / k <= 5); return { step: s, top: Math.ceil(max / s) * s }; };
  let geo, idx = -1;
  const draw = () => {
    const W = plot.clientWidth, H = 260, m = { l: 64, r: 70, t: 8, b: 26 };
    const { step, top } = nice(Math.max(...cur, ...prev.filter(Boolean)));
    const x = (i) => m.l + (i / (N - 1)) * (W - m.l - m.r), y = (v) => m.t + (1 - v / top) * (H - m.t - m.b);
    geo = { x, y, W, H, m };
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const line = (a) => a.map((v, i) => (v == null ? '' : `${i && a[i - 1] != null ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`)).join('');
    let g = '<g class="grid">', ax = '<g class="ax">';
    for (let v = 0; v <= top; v += step) { g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`; ax += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`; }
    const every = W < 480 ? 10 : 5;
    for (let i = 0; i < N; i += every) ax += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${fd(i, { day: 'numeric', month: 'short' }).replace('.', '')}</text>`;
    const lp = prev.findLastIndex((v) => v != null);
    svg.innerHTML = `${g}</g>${ax}</g><path class="area" d="${line(cur)}L${x(N - 1)},${y(0)}L${x(0)},${y(0)}Z"/><path class="cmp" d="${line(prev)}"/><path class="main" d="${line(cur)}"/>
      <text class="lbl m" x="${x(N - 1) + 8}" y="${y(cur[N - 1]) + 4}">Outubro</text><text class="lbl" x="${x(lp) + 8}" y="${Math.max(y(prev[lp]) + 4, y(cur[N - 1]) + 18)}">Setembro</text>
      <g class="xh"><line y1="${m.t}" y2="${H - m.b}"/><circle class="pc" r="4"/><circle class="pm" r="5"/></g>`;
    if (idx >= 0) show(idx, false);
  };
  const show = (i, announce) => {
    idx = Math.max(0, Math.min(N - 1, i)); const { x, y, W } = geo, px = x(idx);
    const xh = svg.querySelector('.xh'); xh.querySelector('line').setAttribute('transform', `translate(${px},0)`);
    const pm = xh.querySelector('.pm'), pc = xh.querySelector('.pc'); pm.setAttribute('cx', px); pm.setAttribute('cy', y(cur[idx]));
    if (prev[idx] != null) { pc.setAttribute('cx', px); pc.setAttribute('cy', y(prev[idx])); pc.style.display = ''; } else pc.style.display = 'none';
    const d = prev[idx] != null ? (cur[idx] - prev[idx]) / prev[idx] : null;
    tip.innerHTML = `<b>${fd(idx, { weekday: 'long', day: 'numeric', month: 'long' })}</b><span>Outubro <em>${brl.format(cur[idx])}</em></span><span>Setembro <em>${prev[idx] == null ? '—' : brl.format(prev[idx])}</em></span>${d == null ? '' : `<span>Diferença <em>${d >= 0 ? '+' : '−'}${Math.abs(d * 100).toFixed(1).replace('.', ',')}%</em></span>`}`;
    const tw = tip.offsetWidth; tip.style.translate = `${Math.min(Math.max(0, px + 12 + tw > W ? px - tw - 12 : px + 12), W - tw)}px ${Math.max(0, y(cur[idx]) - 70)}px`;
    plot.classList.add('is-on');
    if (announce) live.textContent = `${fd(idx, { day: 'numeric', month: 'long' })}: ${brl.format(cur[idx])}${d == null ? '' : `, ${d >= 0 ? 'mais' : 'menos'} ${Math.abs(d * 100).toFixed(0)}% que setembro`}`;
  };
  const fromX = (cx) => { const r = svg.getBoundingClientRect(), { m, W } = geo; return Math.round(((cx - r.left) * (W / r.width) - m.l) / (W - m.l - m.r) * (N - 1)); };
  plot.addEventListener('pointermove', (e) => show(fromX(e.clientX), false));
  plot.addEventListener('pointerdown', (e) => show(fromX(e.clientX), false));
  plot.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && document.activeElement !== plot) plot.classList.remove('is-on'); });
  plot.addEventListener('focus', () => show(idx < 0 ? N - 1 : idx, true));
  plot.addEventListener('blur', () => plot.classList.remove('is-on'));
  plot.addEventListener('keydown', (e) => { const k = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (k) { e.preventDefault(); show(idx + k, true); } if (e.key === 'Home') { e.preventDefault(); show(0, true); } if (e.key === 'End') { e.preventDefault(); show(N - 1, true); } if (e.key === 'Escape') plot.classList.remove('is-on'); });
  new ResizeObserver(draw).observe(plot);
})();
</script>
