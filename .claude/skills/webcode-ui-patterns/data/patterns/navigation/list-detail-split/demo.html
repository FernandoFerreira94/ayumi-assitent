<style>
  .sv-stage { min-height: 100vh; padding: 16px; display: grid; }
  .sv { container-type: inline-size; position: relative; overflow: hidden; border: 1px solid var(--wc-border); border-radius: var(--wc-radius-lg); background: var(--wc-surface); min-height: 560px; }
  .sv-grid { display: grid; height: 100%; }
  .sv-list { display: flex; flex-direction: column; min-width: 0; }
  .sv-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--wc-border); min-height: var(--wc-size-control-lg); }
  .sv-head h2 { margin: 0; font: var(--wc-font-weight-semibold) var(--wc-font-size-lg) / var(--wc-line-height-tight) var(--wc-font-display); outline: none; }
  .sv-items { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; overflow: auto; }
  .sv-items a { display: grid; grid-template-columns: 36px 1fr auto; gap: 2px 12px; padding: 10px; border-radius: var(--wc-radius-md); color: var(--wc-fg); text-decoration: none; }
  .sv-items a:hover { background: var(--wc-sunken); }
  .sv-items a[aria-current="true"] { background: var(--wc-accent-soft); }
  .sv-items a[aria-current="true"] :is(.sv-time, .sv-prev) { color: var(--wc-fg); }
  .sv-av { grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--wc-sunken); color: var(--wc-fg-muted); font-size: var(--wc-font-size-sm); font-weight: var(--wc-font-weight-semibold); }
  .sv-name { font-weight: var(--wc-font-weight-semibold); font-size: var(--wc-font-size-sm); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sv-time { font-size: var(--wc-font-size-xs); color: var(--wc-fg-muted); }
  .sv-prev { grid-column: 2 / -1; font-size: var(--wc-font-size-sm); color: var(--wc-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sv-detail { display: flex; flex-direction: column; min-width: 0; background: var(--wc-surface); }
  .sv-back { display: inline-flex; align-items: center; gap: 4px; height: var(--wc-size-control-md); padding: 0 8px 0 2px; margin-left: -6px; border: 0; border-radius: var(--wc-radius-button); background: none; color: var(--wc-accent); font: inherit; font-weight: var(--wc-font-weight-medium); cursor: pointer; }
  .sv-body { padding: 16px; display: grid; gap: 12px; align-content: start; overflow: auto; }
  .sv-body p { margin: 0; line-height: var(--wc-line-height-normal); }
  .sv-meta { color: var(--wc-fg-muted); font-size: var(--wc-font-size-sm); }
  .sv-empty { margin: auto; color: var(--wc-fg-muted); font-size: var(--wc-font-size-sm); text-align: center; padding: 24px; }
  .sv :focus-visible { outline: 2px solid var(--wc-focus); outline-offset: 2px; }
  /* Celular: pilha. O detalhe cobre a lista. */
  @container (max-width: 719px) {
    .sv-detail { position: absolute; inset: 0; translate: 100% 0; visibility: hidden; transition: translate var(--wc-motion-duration-base) var(--wc-motion-ease-out), visibility 0s var(--wc-motion-duration-base); box-shadow: var(--wc-shadow-lg); }
    .sv[data-open] .sv-detail { translate: 0 0; visibility: visible; transition-delay: 0s; }
    .sv[data-open] .sv-list { visibility: hidden; transition: visibility 0s var(--wc-motion-duration-base); }
    .sv-empty { display: none; }
  }
  /* iPad / desktop: duas colunas. */
  @container (min-width: 720px) {
    .sv-grid { grid-template-columns: minmax(280px, 340px) 1fr; }
    .sv-list { border-right: 1px solid var(--wc-border); }
    .sv-back { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .sv-detail { transition: none !important; } }
</style>
<main class="sv-stage">
  <div class="sv">
    <div class="sv-grid">
      <nav class="sv-list" aria-labelledby="sv-lt">
        <div class="sv-head"><h2 id="sv-lt">Mensagens</h2></div>
        <ul class="sv-items"></ul>
      </nav>
      <section class="sv-detail" aria-labelledby="sv-dt">
        <div class="sv-head"><button class="sv-back" type="button" aria-label="Voltar para Mensagens"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Mensagens</button><h2 id="sv-dt" tabindex="-1"></h2></div>
        <div class="sv-body"><p class="sv-empty">Escolha uma conversa na lista.</p></div>
      </section>
    </div>
  </div>
</main>
<script>
(() => {
  const data = [
    { id: 'ana', n: 'Ana Souza', t: '09:41', p: 'Pedido #4821 saiu para entrega', b: 'Oi! O pedido #4821 saiu para entrega agora há pouco. Previsão até 14h, CEP 01310-100.' },
    { id: 'bruno', n: 'Bruno Lima', t: '08:12', p: 'Pode confirmar o Pix de R$ 189,90?', b: 'Bom dia. Pode confirmar se o Pix de R$ 189,90 caiu? Mandei às 7h58.' },
    { id: 'carla', n: 'Carla Mendes', t: 'Ontem', p: 'Troca do tamanho M pelo G', b: 'Queria trocar a camiseta tamanho M pelo G. A etiqueta ainda está nela.' },
    { id: 'diego', n: 'Diego Rocha', t: 'Seg', p: 'Nota fiscal da compra', b: 'Preciso da nota fiscal da compra do dia 28 para reembolso da empresa. CNPJ 12.345.678/0001-90.' },
    { id: 'elisa', n: 'Elisa Prado', t: 'Dom', p: 'Obrigada pelo atendimento!', b: 'Obrigada pelo atendimento rápido, deu tudo certo.' },
  ];
  const root = document.querySelector('.sv'), ul = root.querySelector('.sv-items'), title = document.getElementById('sv-dt'), body = root.querySelector('.sv-body'), back = root.querySelector('.sv-back');
  ul.innerHTML = data.map((d) => `<li><a href="#${d.id}" data-id="${d.id}"><span class="sv-av" aria-hidden="true">${d.n.split(' ').map((w) => w[0]).join('')}</span><span class="sv-name">${d.n}</span><span class="sv-time">${d.t}</span><span class="sv-prev">${d.p}</span></a></li>`).join('');
  const links = [...ul.querySelectorAll('a')];
  const stacked = () => root.clientWidth < 720;
  let last;
  function open(id, focus) {
    const d = data.find((x) => x.id === id); if (!d) return;
    links.forEach((a) => a.removeAttribute('aria-current'));
    last = links.find((a) => a.dataset.id === id); last.setAttribute('aria-current', 'true');
    title.textContent = d.n;
    body.innerHTML = `<p class="sv-meta">${d.t} · ${d.p}</p><p>${d.b}</p>`;
    root.setAttribute('data-open', '');
    if (focus && stacked()) title.focus({ preventScroll: true });
  }
  function close() { root.removeAttribute('data-open'); last && last.focus(); }
  ul.addEventListener('click', (e) => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); open(a.dataset.id, true); });
  ul.addEventListener('keydown', (e) => {
    const i = links.indexOf(document.activeElement); if (i < 0) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); links[(i + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length].focus(); }
  });
  back.addEventListener('click', close);
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && stacked() && root.hasAttribute('data-open')) close(); });
  if (!stacked()) open(data[0].id, false);
})();
</script>
