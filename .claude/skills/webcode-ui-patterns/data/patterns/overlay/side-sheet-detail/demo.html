<style>
  .ss { --ss-w: min(440px, 100%); min-height: 100vh; padding: 20px; transition: padding var(--wc-motion-duration-base) var(--wc-motion-ease-out); }
  .ss.is-open { padding-inline-end: calc(var(--ss-w) + 20px); }
  @media (max-width: 959px) { .ss.is-open { padding-inline-end: 20px; } }
  .ss h1 { margin: 0 0 12px; font: var(--wc-font-weight-semibold) var(--wc-font-size-xl) var(--wc-font-display); }
  .ss-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--wc-border); border-radius: var(--wc-radius-lg); background: var(--wc-surface); overflow: hidden; }
  .ss-list li + li { border-top: 1px solid var(--wc-border); }
  .ss-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; min-height: 56px; padding: 10px 16px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .ss-item:hover { background: var(--wc-sunken); }
  .ss-item[aria-current="true"] { background: var(--wc-accent-soft); box-shadow: inset 3px 0 0 var(--wc-accent); }
  .ss-item:focus-visible, .ss-panel button:focus-visible, .ss-panel:focus-visible { outline: 2px solid var(--wc-focus); outline-offset: -2px; }
  .ss-item small { color: var(--wc-fg-muted); }
  .ss-item b { grid-row: span 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: var(--wc-font-weight-medium); }
  .ss-hint { margin-top: 10px; color: var(--wc-fg-muted); font-size: var(--wc-font-size-sm); }
  .ss-hint kbd { font-family: var(--wc-font-mono); padding: 1px 6px; border: 1px solid var(--wc-border); border-radius: var(--wc-radius-sm); background: var(--wc-surface); }
  .ss-panel { position: fixed; inset: 0 0 0 auto; margin: 0; width: var(--ss-w); max-width: 100%; height: 100%; max-height: none; padding: 0; border: 0; border-left: 1px solid var(--wc-border); background: var(--wc-surface-raised); color: var(--wc-fg); box-shadow: var(--wc-shadow-lg); translate: 0 0; opacity: 1; transition: translate var(--wc-motion-spring-smooth-duration) var(--wc-motion-spring-smooth), opacity var(--wc-motion-duration-fast), display var(--wc-motion-duration-slow) allow-discrete, overlay var(--wc-motion-duration-slow) allow-discrete; }
  .ss-panel:not([open]) { translate: 100% 0; transition-duration: var(--wc-motion-duration-fast); transition-timing-function: var(--wc-motion-ease-in); }
  @starting-style { .ss-panel[open] { translate: 100% 0; } }
  .ss-panel::backdrop { background: var(--wc-scrim); }
  @media (max-width: 959px) { .ss-panel { width: 100%; border-left: 0; } }
  @media (prefers-reduced-motion: reduce) { .ss-panel, .ss-panel:not([open]) { translate: 0 0; } .ss-panel:not([open]) { opacity: 0; } @starting-style { .ss-panel[open] { translate: 0 0; opacity: 0; } } }
  .ss-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--wc-border); }
  .ss-head h2 { flex: 1; margin: 0; font: var(--wc-font-weight-semibold) var(--wc-font-size-lg) var(--wc-font-display); outline: none; }
  .ss-icon { display: grid; place-items: center; width: var(--wc-size-touch-min); height: var(--wc-size-touch-min); border: 0; border-radius: var(--wc-radius-pill); background: transparent; color: var(--wc-fg-muted); font: inherit; font-size: var(--wc-font-size-lg); cursor: pointer; }
  .ss-icon:hover { background: var(--wc-sunken); color: var(--wc-fg); }
  .ss-body { padding: 20px; overflow-y: auto; overscroll-behavior: contain; }
  .ss-badge { display: inline-block; padding: 2px 10px; border-radius: var(--wc-radius-pill); font-size: var(--wc-font-size-sm); background: var(--wc-success-soft); color: var(--wc-success); }
  .ss-badge[data-s="Atrasado"] { background: var(--wc-danger-soft); color: var(--wc-danger); }
  .ss-badge[data-s="Em separação"] { background: var(--wc-warning-soft); color: var(--wc-warning); }
  .ss-dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 20px 0 0; }
  .ss-dl dt { color: var(--wc-fg-muted); }
  .ss-dl dd { margin: 0; font-variant-numeric: tabular-nums; }
</style>
<div class="ss">
  <h1 id="ss-list-title">Pedidos de hoje</h1>
  <ul class="ss-list" aria-labelledby="ss-list-title"></ul>
  <p class="ss-hint">Clique em um pedido. Com o painel aberto, <kbd>J</kbd>/<kbd>K</kbd> trocam de pedido e <kbd>Esc</kbd> fecha.</p>
</div>
<dialog class="ss-panel" id="ss-panel" aria-labelledby="ss-title">
  <div class="ss-head">
    <h2 id="ss-title" tabindex="-1"></h2>
    <button class="ss-icon" type="button" data-step="-1" aria-label="Pedido anterior">↑</button>
    <button class="ss-icon" type="button" data-step="1" aria-label="Próximo pedido">↓</button>
    <button class="ss-icon" type="button" data-close aria-label="Fechar">×</button>
  </div>
  <div class="ss-body">
    <span class="ss-badge"></span>
    <dl class="ss-dl"></dl>
  </div>
</dialog>
<script>
(() => {
  const data = [
    { id: 1043, cliente: 'Ana Ribeiro', valor: 'R$ 389,90', status: 'Pago', entrega: 'Hoje, 14h–16h', pagamento: 'Pix' },
    { id: 1044, cliente: 'Mercado Bom Preço', valor: 'R$ 2.140,00', status: 'Em separação', entrega: 'Amanhã', pagamento: 'Boleto' },
    { id: 1045, cliente: 'Carlos Menezes', valor: 'R$ 74,50', status: 'Atrasado', entrega: 'Ontem', pagamento: 'Cartão 3×' },
    { id: 1046, cliente: 'Studio Lume', valor: 'R$ 1.020,00', status: 'Pago', entrega: 'Hoje, 18h–20h', pagamento: 'Pix' },
  ];
  const root = document.querySelector('.ss');
  const list = root.querySelector('.ss-list');
  const panel = document.getElementById('ss-panel');
  const wide = matchMedia('(min-width: 960px)');
  let current = -1;
  list.innerHTML = data.map((d, i) => `<li><button class="ss-item" type="button" data-i="${i}" aria-controls="ss-panel" aria-expanded="false"><span>#${d.id} · ${d.cliente}</span><b>${d.valor}</b><small>${d.status}</small></button></li>`).join('');
  const items = [...list.querySelectorAll('.ss-item')];
  const render = (i) => {
    current = i;
    const d = data[i];
    panel.querySelector('#ss-title').textContent = `Pedido #${d.id}`;
    const badge = panel.querySelector('.ss-badge'); badge.textContent = d.status; badge.dataset.s = d.status;
    panel.querySelector('.ss-dl').innerHTML = [['Cliente', d.cliente], ['Valor', d.valor], ['Pagamento', d.pagamento], ['Entrega', d.entrega]].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    items.forEach((b, j) => { b.setAttribute('aria-current', String(j === i)); b.setAttribute('aria-expanded', String(j === i)); });
  };
  const open = (i) => {
    render(i);
    if (!panel.open) { wide.matches ? panel.show() : panel.showModal(); root.classList.add('is-open'); }
    panel.querySelector('#ss-title').focus();
  };
  const close = () => panel.close();
  panel.addEventListener('close', () => {
    root.classList.remove('is-open');
    items.forEach((b) => { b.setAttribute('aria-current', 'false'); b.setAttribute('aria-expanded', 'false'); });
    items[current]?.focus();
  });
  items.forEach((b, i) => b.addEventListener('click', () => open(i)));
  panel.querySelector('[data-close]').addEventListener('click', close);
  panel.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => render((current + Number(b.dataset.step) + data.length) % data.length)));
  const keys = (e) => {
    if (!panel.open || e.target.matches('input, textarea')) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    const step = { j: 1, ArrowDown: 1, k: -1, ArrowUp: -1 }[e.key];
    if (step) { e.preventDefault(); render((current + step + data.length) % data.length); }
  };
  panel.addEventListener('keydown', keys);
  list.addEventListener('keydown', keys);
})();
</script>
